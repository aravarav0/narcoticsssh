<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SIH26231 pocket card — 10 × 8.5 cm</title>
  <style>
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4 portrait; margin: 12mm; }
    body { font-family: Arial, sans-serif; margin: 0; color: #111; }
    .hint { font-size: 13px; line-height: 1.45; margin: 0 0 10px; max-width: 190mm; }
    .row { display: flex; gap: 12mm; flex-wrap: wrap; }
    .card {
      width: 100mm;
      height: 85mm;
      border: 1.5px dashed #111;
      padding: 5mm 5mm 4mm;
      background: #fff;
    }
    .title { font-size: 9px; font-weight: 700; margin: 0 0 2mm; letter-spacing: 0.05em; }
    .grid { display: grid; grid-template-columns: 25mm 25mm 25mm; justify-content: space-between; row-gap: 3mm; }
    .cell { width: 25mm; }
    .swatch { width: 25mm; height: 25mm; border: 1px solid #222; }
    .name { font-size: 8px; font-weight: 700; text-align: center; margin-top: 1mm; }
    .foot { font-size: 8px; margin: 2mm 0 0; }
    @media print { .noprint { display: none; } }
  </style>
</head>
<body>
  <div class="hint noprint">
    Card size <strong>10 cm × 8.5 cm</strong>. Each square <strong>2.5 cm × 2.5 cm</strong>.
    Print colour, matte, 100%, Background graphics ON. Cut the dashed rectangle.
    Paste order (same as the app overlay): WHITE GRAY RED on top, BLACK YELLOW PURPLE under.
  </div>
  <div class="row">
    <div class="card" id="a"></div>
    <div class="card" id="b"></div>
  </div>
  <script>
    const html = `
      <p class="title">SIH26231 · 10 × 8.5 cm · keep in kit pouch</p>
      <div class="grid">
        <div class="cell"><div class="swatch" style="background:#ffffff"></div><div class="name">WHITE</div></div>
        <div class="cell"><div class="swatch" style="background:#808080"></div><div class="name">GRAY</div></div>
        <div class="cell"><div class="swatch" style="background:#e02020"></div><div class="name">RED</div></div>
        <div class="cell"><div class="swatch" style="background:#111111"></div><div class="name">BLACK</div></div>
        <div class="cell"><div class="swatch" style="background:#f0d020"></div><div class="name">YELLOW</div></div>
        <div class="cell"><div class="swatch" style="background:#7030a0"></div><div class="name">PURPLE</div></div>
      </div>
      <p class="foot">Hold under the kit, same photo. Glue corners only. Do not laminate.</p>`
    document.getElementById("a").innerHTML = html
    document.getElementById("b").innerHTML = html.replace("keep in kit pouch", "spare")
  </script>
</body>
</html>
