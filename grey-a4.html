<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SIH26231 gray A4 — RGB 128,128,128</title>
  <style>
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4 portrait; margin: 0; }
    html, body { margin: 0; height: 100%; }
    .sheet {
      width: 210mm;
      height: 297mm;
      background: #808080;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }
    .label {
      font: 11px/1.3 Arial, sans-serif;
      color: #fff;
      padding: 6mm;
      text-shadow: 0 0 3px #000;
    }
    @media print {
      .hint { display: none; }
      html, body, .sheet { width: 210mm; height: 297mm; }
    }
    .hint {
      font: 14px/1.45 system-ui, sans-serif;
      padding: 12px 16px;
      background: #111;
      color: #eee;
    }
  </style>
</head>
<body>
  <p class="hint">
    Print this page on <strong>plain / matte A4</strong>, colour, 100% scale, no borders.
    In the print dialog turn on <strong>Background graphics</strong> (Chrome: More settings).
    Cut 5 cm × 5 cm squares from the grey. Colour is RGB 128,128,128 (#808080).
  </p>
  <div class="sheet">
    <div class="label">SIH26231 GRAY · RGB 128, 128, 128 · cut 5 cm squares · do not laminate</div>
  </div>
</body>
</html>
